<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- Primary SEO -->
    <title>SkillScan — Offline Security Analysis for AI Agent Skills</title>
    <meta name="description" content="SkillScan is an open-source static analysis tool that scans AI agent skill files for malicious patterns, prompt injection, data exfiltration, and container escape techniques. Zero network calls. Enterprise CI/CD ready." />
    <meta name="keywords" content="AI agent security, skill file scanner, MCP security, prompt injection detection, SARIF, DevSecOps, offline security analysis, Claude skills, OpenAI tools" />
    <meta name="author" content="SkillScan" />
    <link rel="canonical" href="https://skillscan.sh/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://skillscan.sh/" />
    <meta property="og:title" content="SkillScan — Offline Security Analysis for AI Agent Skills" />
    <meta property="og:description" content="Static analysis for MCP tools, Claude skills, and agent configurations. 77+ detection rules. Zero network calls. Enterprise-grade." />
    <meta property="og:site_name" content="SkillScan" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SkillScan — Offline Security Analysis for AI Agent Skills" />
    <meta name="twitter:description" content="Static analysis for MCP tools, Claude skills, and agent configurations. 77+ detection rules. Zero network calls." />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- AI Crawler Friendly -->
    <meta name="ai-content-declaration" content="human-authored" />

    <!-- Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "SkillScan",
      "applicationCategory": "SecurityApplication",
      "operatingSystem": "Linux, macOS, Windows",
      "description": "Open-source offline static analysis tool for AI agent skill files. Detects malicious patterns, prompt injection, data exfiltration, MCP tool poisoning, and container escape techniques. Enterprise CI/CD ready with SARIF output.",
      "url": "https://skillscan.sh",
      "downloadUrl": "https://pypi.org/project/skillscan-security/",
      "softwareVersion": "0.3",
      "license": "https://opensource.org/licenses/MIT",
      "programmingLanguage": "Python",
      "keywords": "AI security, skill files, MCP, prompt injection, SARIF, DevSecOps",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Organization",
        "name": "SkillScan",
        "url": "https://skillscan.sh"
      },
      "featureList": [
        "77+ detection rules for AI agent skill files",
        "Offline-first static analysis — zero network calls",
        "SARIF and JUnit output formats",
        "GitHub Actions reusable workflow",
        "MCP tool poisoning detection",
        "Prompt injection detection",
        "Container escape pattern detection",
        "Automated pattern updates via CI/CD"
      ]
    }
    </script>

    <!-- Google Fonts: Space Grotesk + Inter + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <style>
      /* Prevent FOUC */
      html { background: oklch(0.12 0.025 265); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
